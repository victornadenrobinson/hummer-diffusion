name: Benchmark MACE-OFF throughput

# Measures MD steps/second and ns/day on a standard (free) GitHub-hosted CPU
# runner for a few system sizes, and commits the results + a plot to
# benchmarks/ on main. This is what Phase 2 (step 8 of the plan) uses to set
# a realistic TOTAL_STEPS for md_production.yml -- run this and look at the
# plot before trusting that workflow's placeholder step count.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install ase numpy scipy matplotlib mace-torch
          pip install -e . --no-deps

      - name: Run benchmarks across system sizes
        run: |
          mkdir -p benchmarks
          for n in 16 32 64 128; do
            python scripts/benchmark_throughput.py \
              --n-molecules "$n" \
              --model off23-medium \
              --device cpu \
              --runner-label gh-actions-ubuntu-2core \
              --out benchmarks/results.json
          done

      - name: Plot results
        run: python scripts/plot_benchmarks.py --results benchmarks/results.json --out benchmarks/throughput.png

      - name: Commit benchmark results and plot
        run: |
          git config user.name "benchmark-bot"
          git config user.email "benchmark-bot@users.noreply.github.com"
          git add benchmarks/results.json benchmarks/throughput.png
          git diff --cached --quiet || git commit -m "Update MACE-OFF throughput benchmarks [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
